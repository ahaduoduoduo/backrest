# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Test

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "docs/**"
      - "*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "*.md"
  workflow_dispatch:

jobs:
  test-nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@latest

      - name: Create Fake WebUI Sources
        run: |
          mkdir -p webui/dist
          # Create an empty gzip file for testing
          gzip -c /dev/null > webui/dist/index.html.gz

      - name: Build
        run: go build ./...

      - name: Test
        run: PATH=$(pwd):$PATH gotestsum ./... -- --race

  test-webui:
    runs-on: ubuntu-latest
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.27.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: webui/pnpm-lock.yaml

      - name: Install dependencies
        run: cd webui && pnpm install --frozen-lockfile

      # Runs compile-i18n (paraglide) first, then vitest.
      - name: Test
        run: cd webui && pnpm test

      - name: Typecheck
        run: cd webui && pnpm run check
